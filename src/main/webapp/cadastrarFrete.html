<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cadastrar Frete</title>
</head>
<body>
	<h2>Cadastro de Frete</h2>
	<form action="/transcarga/FreteServlet" method="post" accept-charset="UTF-8">
		Destino: <input type="text" name="destino" required><br>
		Peso (kg): <input type="number" name="peso" required><br>
		Transportadora: <input type="text" name="transportadora" required><br>
		<input type="submit" value="Cadastrar Frete">
	</form>
	<br>
	<a href='index.html'>Home</a>
</body>
</html>
